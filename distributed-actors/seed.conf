# Dedicated config for the seed / coordinator node.

mode = "seed"
host = "127.0.0.1"
port = 45500
lifetime = 0

caf {
  middleman {
    enable-automatic-connections = false
    app-identifiers = ["distributed-actors-codex"]
    heartbeat-interval = 0ms
  }
  logger {
    console {
      format = "[%c:%p] %d %m"
      verbosity = "info"
    }
  }
}
