# Default config for local debugging from the distributed-actors-codex folder.
# CAF loads this file automatically when the current working directory contains
# a file named "caf-application.conf".

mode = "seed"
host = "127.0.0.1"
port = 45500
name = "worker-1"
zone = "default"
jobs = 6
lifetime = 0

caf {
  middleman {
    enable-automatic-connections = false
    app-identifiers = ["distributed-actors-codex"]
    heartbeat-interval = 0ms
  }
  logger {
    console {
      format = "[%c:%p] %d %m"
      verbosity = "info"
    }
  }
}
