# Dedicated config for worker-b.

mode = "worker"
host = "127.0.0.1"
port = 45500
name = "worker-b"
zone = "zone-b"
lifetime = 0

caf {
  middleman {
    enable-automatic-connections = false
    app-identifiers = ["distributed-actors-codex"]
    heartbeat-interval = 0ms
  }
  logger {
    console {
      format = "[%c:%p] %d %m"
      verbosity = "info"
    }
  }
}
